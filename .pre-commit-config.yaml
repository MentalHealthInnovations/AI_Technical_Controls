repos:
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: ["-x", "-P", "ClaudeCode/opt/claude/hooks"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: local
    hooks:
      - id: pii-staged-scan
        name: PII staged-content scan
        description: >
          Scans staged file content for PII signatures (emails, UK postcodes,
          UK phone numbers, UK National Insurance numbers, IBANs, DOBs,
          card-shaped 16-digit groups). Trips on 3+ distinct categories or
          10+ hits of a single high-confidence pattern. Detectors live in
          ClaudeCode/opt/claude/hooks/pii-patterns.sh, shared with the
          runtime PreToolUse hook pii-content-sniff.sh.
        entry: ClaudeCode/scripts/pii-staged-scan.sh
        language: system
        pass_filenames: true
        types: [text]
