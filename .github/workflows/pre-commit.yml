name: CI

# Two-job workflow:
#   - pre-commit: runs the pre-commit framework hooks (currently just the PII
#     staged-scan) on every PR and push to main, so contributors who skipped
#     `pre-commit install` locally still cannot land PII content.
#   - hook-tests: runs ClaudeCode/tests/run_all.sh — the regression suite for
#     all four hook layers (path-policy, content-sniff, staged-scan, wild
#     corpus). Without this in CI, threshold changes and regex tightenings
#     would pass CI silently until someone manually pulled the branch.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure bash, jq, and python are available
        # Real GitHub ubuntu-latest has these pre-installed. node:lts-alpine
        # (used by act for local CI testing) has none: Alpine's default
        # shell is ash, and jq/python are not in the base image. This step
        # bootstraps them via apk before any other step runs — every later
        # step assumes bash, so this has to come first and run under sh.
        #
        # The shell: sh override here is critical: without it act would try
        # to run this very step with bash, which is what we're about to
        # install. The fallback path on apt-based images skips checks for
        # binaries that are already there.
        #
        # python is installed here (rather than via actions/setup-python) so
        # the same path works under act, which cannot resolve setup-python's
        # version manifest in its sandboxed environment. Real ubuntu-latest
        # already has python3+pip, so the install becomes a no-op there.
        shell: sh
        run: |
          if ! command -v bash >/dev/null 2>&1 && command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash
          fi
          if ! command -v jq >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache jq
            else
              echo "Cannot install jq: neither apt-get nor apk found." >&2
              exit 1
            fi
          fi
          if ! command -v python3 >/dev/null 2>&1 || ! command -v pip3 >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-pip
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache python3 py3-pip
            else
              echo "Cannot install python: neither apt-get nor apk found." >&2
              exit 1
            fi
          fi
          jq --version
          python3 --version
          pip3 --version

      - name: Check out
        uses: actions/checkout@v4
        with:
          # Need full history so the PII scanner can resolve staged blobs
          # against the merge base on PR runs.
          fetch-depth: 0

      - name: Install pre-commit
        # --break-system-packages required on PEP 668 systems (Alpine, Ubuntu
        # 24.04+) where the system pip refuses to install into the global
        # site-packages without an explicit override. pre-commit is a CLI
        # tool we want on PATH for the next step; we're not polluting an
        # application virtualenv.
        run: pip3 install --break-system-packages pre-commit

      - name: Run pre-commit on all changed files
        # On a PR, diff against the merge base; on a push to main, diff against
        # the previous commit. The scanner walks `git diff --cached` when given
        # no filenames, so we stage the diff first via `pre-commit run --files`.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            mapfile -t files < <(git diff --name-only "$base" "$head")
          else
            mapfile -t files < <(git diff --name-only HEAD~1 HEAD)
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed files; nothing to scan."
            exit 0
          fi
          pre-commit run --files "${files[@]}"

  hook-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure bash, jq, and git are available
        # See the pre-commit job for the rationale — node:lts-alpine (act's
        # default) has neither bash nor jq, and every later step assumes
        # bash. Run under sh so this step can bootstrap bash itself.
        #
        # git is required by run_staged_scan_cases.sh, which builds synthetic
        # repos to drive pii-staged-scan.sh. Real ubuntu-latest has git; Alpine
        # base does not.
        shell: sh
        run: |
          if ! command -v bash >/dev/null 2>&1 && command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash
          fi
          if ! command -v jq >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache jq
            else
              echo "Cannot install jq: neither apt-get nor apk found." >&2
              exit 1
            fi
          fi
          if ! command -v git >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache git
            else
              echo "Cannot install git: neither apt-get nor apk found." >&2
              exit 1
            fi
          fi
          # Print awk dialect for diagnostic purposes — pii-patterns.sh
          # claims POSIX-portable regexes, but if a future pattern uses a
          # gawk-specific feature this is where it'll show up. busybox awk
          # doesn't support --version; fall back to printing the binary path.
          if awk --version >/dev/null 2>&1; then
            awk --version | head -1
          else
            echo "awk: $(command -v awk) (no --version support — likely busybox)"
          fi
          jq --version
          git --version

      - name: Check out
        uses: actions/checkout@v4

      - name: Run all hook regression suites
        # ClaudeCode/tests/run_all.sh runs four suites:
        #   1. pii-path-policy-check.sh   (JSONL cases, 35 tests)
        #   2. pii-content-sniff.sh        (JSONL cases, 15 tests)
        #   3. pii-staged-scan.sh          (synthetic-git-repo cases, 12 tests)
        #   4. pii-content-sniff.sh wild   (false-positive corpus, 3 fixtures)
        # The runner exits non-zero if any suite fails. Wild-corpus failure
        # means a real-world-shaped fixture started tripping a detector,
        # which the table output makes diagnosable.
        run: ClaudeCode/tests/run_all.sh
