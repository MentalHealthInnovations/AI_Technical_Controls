name: CI

# Two-job workflow:
#   - pre-commit: runs the pre-commit framework hooks (currently just the PII
#     staged-scan) on every PR and push to main, so contributors who skipped
#     `pre-commit install` locally still cannot land PII content.
#   - hook-tests: runs ClaudeCode/tests/run_all.sh — the regression suite for
#     all four hook layers (path-policy, content-sniff, staged-scan, wild
#     corpus). Without this in CI, threshold changes and regex tightenings
#     would pass CI silently until someone manually pulled the branch.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure bash and jq are available
        # Real GitHub ubuntu-latest has both pre-installed. node:lts-alpine
        # (used by act for local CI testing) has neither: Alpine's default
        # shell is ash, and jq is not in the base image. This step bootstraps
        # both via apk before any other step runs — every later step assumes
        # bash, so this has to come first and run under sh.
        #
        # The shell: sh override here is critical: without it act would try
        # to run this very step with bash, which is what we're about to
        # install. The fallback path on apt-based images skips both checks
        # since bash and jq are already there.
        shell: sh
        run: |
          if ! command -v bash >/dev/null 2>&1 && command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash
          fi
          if ! command -v jq >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache jq
            else
              echo "Cannot install jq: neither apt-get nor apk found." >&2
              exit 1
            fi
          fi
          jq --version

      - name: Check out
        uses: actions/checkout@v4
        with:
          # Need full history so the PII scanner can resolve staged blobs
          # against the merge base on PR runs.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on all changed files
        # On a PR, diff against the merge base; on a push to main, diff against
        # the previous commit. The scanner walks `git diff --cached` when given
        # no filenames, so we stage the diff first via `pre-commit run --files`.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            mapfile -t files < <(git diff --name-only "$base" "$head")
          else
            mapfile -t files < <(git diff --name-only HEAD~1 HEAD)
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed files; nothing to scan."
            exit 0
          fi
          pre-commit run --files "${files[@]}"

  hook-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure bash and jq are available
        # See the pre-commit job for the rationale — node:lts-alpine (act's
        # default) has neither bash nor jq, and every later step assumes
        # bash. Run under sh so this step can bootstrap bash itself.
        shell: sh
        run: |
          if ! command -v bash >/dev/null 2>&1 && command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash
          fi
          if ! command -v jq >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache jq
            else
              echo "Cannot install jq: neither apt-get nor apk found." >&2
              exit 1
            fi
          fi
          awk --version 2>/dev/null | head -1 || echo "awk: $(command -v awk)"
          jq --version

      - name: Check out
        uses: actions/checkout@v4

      - name: Run all hook regression suites
        # ClaudeCode/tests/run_all.sh runs four suites:
        #   1. pii-path-policy-check.sh   (JSONL cases, 35 tests)
        #   2. pii-content-sniff.sh        (JSONL cases, 15 tests)
        #   3. pii-staged-scan.sh          (synthetic-git-repo cases, 12 tests)
        #   4. pii-content-sniff.sh wild   (false-positive corpus, 3 fixtures)
        # The runner exits non-zero if any suite fails. Wild-corpus failure
        # means a real-world-shaped fixture started tripping a detector,
        # which the table output makes diagnosable.
        run: ClaudeCode/tests/run_all.sh
