name: CI

# Two jobs:
#
#   - pre-commit: lint / format / config-validity checks, defined once in
#     .pre-commit-config.yaml and run here via `pre-commit run --all-files`.
#     This includes the PII staged-scan local hook, so contributors who
#     skipped `pre-commit install` locally still cannot land PII content.
#   - test: ClaudeCode/tests/run_all.sh, the hook and library regression
#     suites. run_all.sh owns the list of suites it runs.
#
# CI covers syntax, config validity, and hook-script regression, and is the
# mandatory merge gate. It does NOT verify live guardrail behaviour under
# Claude Code — /test-guardrails is a recommended additional check for
# changes to hooks, permissions, sandbox config, or managed-settings.json,
# not a required one (see the PR template).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each job's key is a check name the default-branch ruleset requires, so the
# jobs carry no display name. Renaming a key blocks every merge until the
# ruleset names the new one.
jobs:
  pre-commit:
    # Debian-based runner: needed for setup-python and for the Dockerised
    # shellcheck hook, which ubuntu-latest supports out of the box.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run all hooks
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    # Pin the suite to one minimal environment — Alpine (BusyBox awk, apk) —
    # so GitHub CI and local act runs exercise the same thing. The tests need
    # only bash, jq, and git on top of the base image.
    container: alpine:3.24
    steps:
      - name: Install test dependencies
        run: apk add --no-cache bash jq git

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run all hook regression suites
        run: ClaudeCode/tests/run_all.sh
