name: CI

# CI for the governance control pack. Two jobs:
#
#   - pre-commit: lint / format / config-validity checks, defined once in
#     .pre-commit-config.yaml and run here via `pre-commit run --all-files`, so
#     there is no duplicated check configuration. This also runs the PII
#     staged-scan local hook (pii-staged-scan), so contributors who skipped
#     `pre-commit install` locally still cannot land PII content.
#   - hook-tests: runs ClaudeCode/tests/run_all.sh — the regression suite for
#     all four hook layers (path-policy, content-sniff, staged-scan, wild
#     corpus). Without this in CI, threshold changes and regex tightenings
#     would pass CI silently until someone manually pulled the branch.
#
# Scope: syntax, formatting, config validity, and hook-script regression. This
# workflow does NOT verify live guardrail *behaviour* under Claude Code (no hook
# payloads). The /test-guardrails suite remains the behaviour regression net and
# a full run is required in the PR description for changes to hooks, permissions,
# sandbox config, or managed-settings.json.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit (lint, format, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The shellcheck hook runs in Docker (shellcheck-precommit), which the
      # ubuntu-latest runner provides out of the box — no manual install. We set
      # up Python only for pre-commit itself.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run all hooks
        run: pre-commit run --all-files --show-diff-on-failure

  hook-tests:
    name: hook regression suites
    runs-on: ubuntu-latest
    steps:
      - name: Ensure bash, jq, and git are available
        # node:lts-alpine (act's default for local CI testing) has neither bash
        # nor jq, and every later step assumes bash. Run under sh so this step
        # can bootstrap bash itself. Real ubuntu-latest already has all three,
        # so this becomes a no-op there.
        #
        # git is required by run_staged_scan_cases.sh, which builds synthetic
        # repos to drive pii-staged-scan.sh.
        shell: sh
        run: |
          if ! command -v bash >/dev/null 2>&1 && command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash
          fi
          if ! command -v jq >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache jq
            else
              echo "Cannot install jq: neither apt-get nor apk found." >&2
              exit 1
            fi
          fi
          if ! command -v git >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache git
            else
              echo "Cannot install git: neither apt-get nor apk found." >&2
              exit 1
            fi
          fi
          # Print awk dialect for diagnostic purposes — pii-patterns.sh
          # claims POSIX-portable regexes, but if a future pattern uses a
          # gawk-specific feature this is where it'll show up. busybox awk
          # doesn't support --version; fall back to printing the binary path.
          if awk --version >/dev/null 2>&1; then
            awk --version | head -1
          else
            echo "awk: $(command -v awk) (no --version support — likely busybox)"
          fi
          jq --version
          git --version

      - name: Check out
        uses: actions/checkout@v4

      - name: Run all hook regression suites
        # ClaudeCode/tests/run_all.sh runs four suites:
        #   1. pii-path-policy-check.sh   (JSONL cases, 35 tests)
        #   2. pii-content-sniff.sh        (JSONL cases, 15 tests)
        #   3. pii-staged-scan.sh          (synthetic-git-repo cases, 12 tests)
        #   4. pii-content-sniff.sh wild   (false-positive corpus, 3 fixtures)
        # The runner exits non-zero if any suite fails. Wild-corpus failure
        # means a real-world-shaped fixture started tripping a detector,
        # which the table output makes diagnosable.
        run: ClaudeCode/tests/run_all.sh
